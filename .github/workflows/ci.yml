name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Build embedded Web frontend
        working-directory: web
        run: yarn install --frozen-lockfile && yarn build
      - name: Lint Web frontend
        if: runner.os == 'Linux'
        working-directory: web
        run: yarn lint
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Hand-maintained file size boundary
        if: runner.os == 'Linux'
        run: ruby scripts/check_source_size.rb
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Model eval task set self-check
        if: runner.os == 'Linux'
        run: ruby scripts/test/model_eval_test.rb && ruby scripts/model_eval.rb --check-tasks
      - name: CI samples parse
        if: runner.os == 'Linux'
        run: bash -n examples/ci/run-task.sh && ruby -ryaml -e 'ARGV.each { |path| YAML.safe_load_file(path, aliases: true); puts "ok #{path}" }' examples/ci/github-actions.yml examples/ci/gitlab-ci.yml
      - name: SDK crates package
        if: runner.os == 'Linux'
        run: cargo publish --dry-run --locked -p willdeep-runtime-protocol -p willdeep-runtime-client

  linux-architectures:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Build embedded Web frontend
        working-directory: web
        run: yarn install --frozen-lockfile && yarn build
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          command: test
          target: ${{ matrix.target }}
          args: --locked --workspace

  wsl-smoke:
    name: WSL ABI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Build embedded Web frontend
        working-directory: web
        run: yarn install --frozen-lockfile && yarn build
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - name: Build the Linux x86_64 binary consumed by WSL 2
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu -p willdeep
      - name: Smoke test executable and ELF ABI
        run: |
          target/x86_64-unknown-linux-gnu/release/willdeep --version
          file target/x86_64-unknown-linux-gnu/release/willdeep | grep 'ELF 64-bit LSB'
