name: CI

# 诊断分支专用：Windows 上的 hook stdin 捕获。不合入。

on:
  push:

permissions:
  contents: read

jobs:
  windows-hooks:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - name: Probe the capture command directly
        run: python .github/diag/hook_probe.py
      - name: Build core tests
        run: cargo test -p willdeep-core --lib --no-run
      - name: Hook tests serially x3
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($i in 1..3) {
            cargo test -q -p willdeep-core --lib -- hooks:: an_observer_hook --test-threads=1 2>&1 | Select-String -Pattern 'test result|FAILED|panicked|hook'
          }
      - name: Whole core lib in parallel x2
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($i in 1..2) {
            cargo test -q -p willdeep-core --lib 2>&1 | Select-String -Pattern 'test result|FAILED|panicked'
          }
