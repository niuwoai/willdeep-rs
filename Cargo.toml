[workspace]
members = ["crates/willdeep-core", "crates/willdeep-cli"]
resolver = "2"

[workspace.package]
version = "0.9.0-rc1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/niuwoai/willdeep-rs"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
uuid = { version = "1.18", features = ["v4", "serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.29"
unicode-width = "0.2"
arboard = { version = "3.6", features = ["image-data"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
http = "1.3"
qrcode = { version = "0.14", default-features = false }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
