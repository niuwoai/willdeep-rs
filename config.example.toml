version = 1
default_provider = "some-im"

[agent]
max_turns = 24
approval = "smart"
language = "zh-CN" # zh-CN | en | ja; can be overridden by WILLDEEP_LANGUAGE/--language
# smart / workspace-write 模式下的两级审批：本地静态规则先判，判不了的交给 AI 判官。
# 关掉判官，所有拿不准的命令都会直接弹审批卡。
safety_judge = true
# judge_model = "someim-security-guard" # some.im 默认走网关托管的安全策略；其它 provider 默认取会话模型
# compressor_model = "someim-32b-compressor" # 上下文压缩模型；some.im 默认走网关托管压缩（固定指令服务端注入），其它 provider 默认取会话模型
auto_title = true       # 会话第一轮自动整理标题；关掉后停在第一条提示词的派生标题
# title_model = "glm-5" # 标题摘要模型；默认取会话模型（请求只发一问一答各 800 字）
small_model_routing = true
auto_dispatch_read_only = true
max_deep_calls_per_harness = 1
# OS 级写入围栏（macOS Seatbelt / Linux bubblewrap）。默认关。
# 开着时，Shell 命令只能往工作区和临时目录里写——由内核裁决，不由审批闸门裁决。
# 默认关是因为它会改变已在跑的命令的行为：`cargo fetch` 写不了工作区外的
# ~/.cargo/registry，除非把那条路径列进 sandbox_writable_roots。
# sandbox = false
# sandbox_writable_roots = ["~/.cargo/registry", "~/.cargo/git"]

# 与 Swift App 同语义的自建辅助模型。可使用域名、局域网 IP 或回环地址，不需要 API Key。
# 文本辅助任务共用 summary_model，避免本机同时驻留多份模型。
[local_model]
enabled = false
base_url = "http://127.0.0.1:11434/v1"
summary_model = "gemma4:e4b-it-qat"
prefer_for_titles = true
prefer_for_context_summaries = false
prefer_for_worker_routing = true

# 生命周期挂钩：审计留痕与门禁拦截。
# 与 [notifications] 那条 webhook 分开：webhook 是事后的礼貌通知、可以丢；
# hook 是事中的裁决、跑在关键路径上，非零退出会真的把动作拦下来。
# 事件 JSON 从 stdin 喂进去；退出码 0 放行，阻塞式 hook 非零退出即拦截，
# stderr 作为拒绝理由回给模型和用户。
#
# [[hooks]]
# name = "audit"
# event = "pre_tool"              # pre_tool | post_tool | approval_resolved
# command = "jq -c . >> /var/log/willdeep-audit.jsonl"
#
# [[hooks]]
# name = "change-ticket"
# event = "pre_tool"              # 只有 pre_tool 拦得住；post_tool 发生在事后
# command = "/usr/local/bin/check-change-ticket"
# blocking = true
# timeout_seconds = 10
# on_error = "deny"               # deny（默认）| ignore；坏掉就放行的门禁等于没门禁

# Shared by WillDeep.app and willdeep-rs. Local HTTP endpoints are supported
# for home automation, desktop notifications, and other personal workflows.
# Both clients POST the same `willdeep.webhook.v1` envelope, so one endpoint
# can serve the app and the CLI with one parser. The body carries the event,
# status, session identity, and a truncated summary — never the conversation.
# Unknown keys here are ignored on purpose so the desktop app can add fields
# without breaking an older CLI reading the same file.
[notifications]
sound = "system-default"
custom_sound_file = ""
custom_sound_display_name = ""
webhook_enabled = false
webhook_url = "http://127.0.0.1:8787/willdeep"
webhook_on_task_completed = true
webhook_on_attention_required = true

[providers.some-im]
provider = "some-im"
api = "chat-completions"
api_base = "https://some.im/v1"
api_key_env = "SOMEIM_API_KEY"
model = "glm-5"
# Text-only some.im models use this model to describe pasted images first.
vision_model = "qwen3-vl-plus"
context_window = 131072

[providers.openai-responses]
provider = "openai-compatible"
api = "responses"
api_base = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "gpt-5"

[providers.anthropic]
provider = "anthropic"
api = "anthropic-messages"
api_base = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-4-5"
max_output_tokens = 16384

# Optional per-trade policy overrides. When the parent is some.im, omit
# provider_profile/model for hosted narrow trades so WillDeep selects the
# matching someim-32b-<trade> model. Explicit model bindings replace that
# hosted mapping. provider_profile references [providers.*].
# The built-in deployable tiers are 32K/48K/64K/256K. Bind them to private or
# on-prem Provider profiles to keep enterprise source and prompts off the
# public internet. Only `deep` is the scarce 1M escalation path.
# Public selectors show reader/implementer/tester/ops_runner/judge/deep. The
# specialist sections below remain valid for automatic routing and saved-flow
# compatibility.
[subagents.scout]
max_turns = 8
context_window = 32768
tool_output_limit = 4096
token_budget = 32000
timeout_seconds = 300
max_consecutive_failures = 3

[subagents.reader]
context_window = 49152

[subagents.deep]
# L-tier work is explicit: whole-repo reasoning or indivisible huge material.
# The runtime requires an escalation ticket before this profile may start.
provider_profile = "some-im"
model = "deepseek-v4-flash"
context_window = 1000000
max_turns = 12

[subagents.editor]
max_turns = 6
# Writing profiles default to a dedicated, reviewable Git worktree.
worktree = "dedicated"

[subagents.implementer]
# Bind this to an intranet/on-prem model for private daily coding.
provider_profile = "some-im"
model = "glm-5"
max_turns = 18
context_window = 262144
tool_output_limit = 16384
timeout_seconds = 1200
worktree = "dedicated"

[subagents.tester]
context_window = 65536
max_turns = 18
timeout_seconds = 900

[subagents.ops_runner]
context_window = 49152
max_turns = 32
timeout_seconds = 1200

[subagents.judge]
context_window = 49152
max_turns = 12
timeout_seconds = 600

# Verified workers: the runtime runs task.verifier.command after every attempt
# and the exit code is the verdict. max_attempts bounds how many times a
# failure is digested and handed back before the run fails and asks for a
# model escalation.
[subagents.test_fixer]
max_turns = 8
context_window = 65536
tool_output_limit = 6144
max_attempts = 3
timeout_seconds = 900
worktree = "dedicated"

[subagents.build_fixer]
context_window = 49152
tool_output_limit = 5120
max_attempts = 3
worktree = "dedicated"

# Read-only reporters. log_inspector reads a failure log and names the cause;
# git_detective works backwards through history to the commit that broke it.
[subagents.log_inspector]
context_window = 32768
tool_output_limit = 4096

[subagents.git_detective]
context_window = 32768

# MCP stdio servers are initialized once and exposed as
# mcp__<server>__<tool>. Put credentials in inherited environment variables;
# do not write tokens into this file.
[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/workspace"]
startup_timeout_seconds = 30
enabled = false

[mcp_servers.filesystem.env]
NODE_NO_WARNINGS = "1"

# Additional roots whose immediate child directories contain SKILL.md.
[skills]
roots = []

# Direct keys are supported, but api_key_env is preferred. If api_key is
# present on Unix, WillDeep requires the config file permissions to be 0600.
# api_key = "<your-key>"
